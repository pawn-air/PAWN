[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pawn-gcs"
version = "3.0.0"
description = "PAWN Ground Control Station - minimal web GCS for DJI Tello (live FPV, keyboard control, raw telemetry, logs, simulator)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "av>=12.0",
  "opencv-contrib-python>=4.8,<5",
  "numpy>=1.24",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "playwright"]
build = ["pyinstaller>=6.0"]

[project.scripts]
pawn-gcs = "pawn_gcs.__main__:main"

[tool.setuptools.packages.find]
include = ["pawn_gcs*"]

[tool.setuptools.package-data]
pawn_gcs = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
