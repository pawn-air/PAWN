[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pawn-gcs"
version = "2.0.0"
description = "PAWN Ground Control Station - web GCS for DJI Tello search & rescue (live FPV, telemetry, 3D target localisation, backtracking/RTH, coverage, SAR patterns, collision guard, 3D dataset export, vision plugins, autonomy, flight logs, simulator)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "av>=12.0",
  "opencv-contrib-python>=4.8,<5",
  "numpy>=1.24",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
yolo = ["ultralytics"]
dev = ["pytest", "httpx", "playwright"]
build = ["pyinstaller>=6.0"]

[project.scripts]
pawn-gcs = "pawn_gcs.__main__:main"

[tool.setuptools.packages.find]
include = ["pawn_gcs*"]

[tool.setuptools.package-data]
pawn_gcs = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
